<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Search</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: .25rem; }
    fieldset { margin: 1rem 0; border: 1px solid #ccc; border-radius: 6px; }
    input, select, button { padding: .4rem .6rem; font-size: 1rem; }
    #q { width: 16rem; }
    #status { margin: .75rem 0; color: #555; }
    pre { background: #111; color: #ddd; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: .85rem; }
    .ln { color: #888; margin-right: 1rem; }
    mark { background: #ffd54f; }
    .ERROR { color: #ff6b6b; } .WARN { color: #ffb74d; }
  </style>
</head>
<body>
  <h1>Log Search</h1>
  <p>C++ inverted index behind a Java API. <a href="/swagger-ui.html">Swagger</a></p>

  <fieldset>
    <legend>1. Upload a log</legend>
    <input type="file" id="file">
    <button onclick="upload()">Upload &amp; index</button>
  </fieldset>

  <fieldset>
    <legend>2. Search</legend>
    <select id="log"></select>
    <input id="q" placeholder="words, e.g. timeout payment">
    <select id="level">
      <option value="">any level</option>
      <option>ERROR</option><option>WARN</option><option>INFO</option><option>DEBUG</option>
    </select>
    <select id="engine">
      <option value="cpp">C++ index</option>
      <option value="java">Java scan (baseline)</option>
    </select>
    <br><br>
    from <input type="datetime-local" id="from" step="1">
    to <input type="datetime-local" id="to" step="1">
    <button onclick="search()">Search</button>
  </fieldset>

  <div id="status"></div>
  <pre id="results"></pre>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function loadLogs() {
  const res = await fetch('/api/logs');
  const logs = await res.json();
  $('log').innerHTML = logs.map(l =>
    `<option value="${l.id}">${l.id} (${(l.sizeBytes / 1048576).toFixed(1)} MB)</option>`).join('');
}

async function upload() {
  const f = $('file').files[0];
  if (!f) return;
  $('status').textContent = 'Uploading and indexing...';
  const body = new FormData();
  body.append('file', f);
  const res = await fetch('/api/logs', { method: 'POST', body });
  $('status').textContent = res.ok ? 'Indexed.' : 'Upload failed: ' + await res.text();
  loadLogs();
}

async function search() {
  const params = new URLSearchParams({ q: $('q').value, engine: $('engine').value, limit: 200 });
  if ($('level').value) params.set('level', $('level').value);
  if ($('from').value) params.set('from', $('from').value.length === 16 ? $('from').value + ':00' : $('from').value);
  if ($('to').value) params.set('to', $('to').value.length === 16 ? $('to').value + ':00' : $('to').value);

  $('status').textContent = 'Searching...';
  const res = await fetch(`/api/logs/${$('log').value}/search?` + params);
  if (!res.ok) { $('status').textContent = 'Error: ' + await res.text(); return; }
  const data = await res.json();
  console.log("API Response:", data);
  console.log("First result:", data.results[0]);
  console.log("Log text:", data.results[0]?.text);

  $('status').textContent =
    `${data.totalMatches} matches, showing ${data.returned} - ${data.tookMs} ms (${data.engine})`;
  const words = $('q').value.trim().split(/\s+/).filter(Boolean);
  $('results').innerHTML = data.results.map(r => {
    let t = esc(r.text);
    words.forEach(w => {
      const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      t = t.replace(re, '<mark>$1</mark>');
    });
    const cls = / (ERROR|WARN) /.exec(r.text);
    return `<span class="ln">${r.lineNumber}</span><span class="${cls ? cls[1] : ''}">${t}</span>`;
  }).join('\n');
}

loadLogs();
</script>
</body>
</html>
