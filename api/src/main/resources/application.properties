server.port=8081
server.error.include-message=always

# log, index and offset file are stored here
logsearch.storage-dir=./data

# Path to the compiled C++ Index
logsearch.indexer-path=../indexer/build/logindex

# To Allow big log file uploads
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
